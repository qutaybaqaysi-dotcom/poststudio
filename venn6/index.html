<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:type" content="website">
<meta property="og:url" content="https://poststudio.org/venn6/">
<meta property="og:image" content="https://poststudio.org/venn6/og.jpg?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://poststudio.org/venn6/og.jpg?v=1">
<title></title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
{
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, dpr;
/* the field the circles move in, the line under it, and the dots */
let FX, FY, FW, FH, U, LINE, DX0, DS, TOP = 0;
/* the two walls: they start at the inner limit; the viewer drags each one out, as far as the screen edge */
/* a single dot under the rows opens the piece full screen, where the browser allows it (desktop) */
const FS = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function fsY() { return rowY(3) + ROW * 1.4; }
function onFs(e) { return FS && Math.hypot(e.clientX - (DX0 + DS / 2), e.clientY - fsY()) < 14; }
function toggleFs() {
  const de = document.documentElement;
  try {
    if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
    else { (de.requestFullscreen || de.webkitRequestFullscreen).call(de); }
  } catch (err) {}
}
let WL = 0, WR = 0, LIM0 = 0, LIM1 = 0, held = null, sized = false;
/* four scales, 0 to 10, 5 the middle: each person has a speed and a size */
const scales = [
  { name: "you speed", z: 5 }, { name: "you size", z: 5 },
  { name: "me speed", z: 5 }, { name: "me size", z: 5 }
];
const ROW = 34;
function speed(k) { return Math.pow(1.45, scales[k * 2].z - 5); }
function radius(k) { return 0.0625 + scales[k * 2 + 1].z * 0.025; }
const circles = [0, 1].map(function (k) {
  return { x: 0.3 + Math.random() * 0.4, y: 0.3 + Math.random() * 0.4, a: Math.random() * Math.PI * 2, sp: 0.018 + Math.random() * 0.008, word: k ? "me" : "you" };
});
function rowY(i) { return TOP + ROW / 2 + i * ROW + (i >= 2 ? 10 : 0); }
function size() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const block = ROW * 4 + 10 + (FS ? ROW * 1.4 : 0);
  TOP = H - block - Math.max(30, H * 0.06);
  LINE = TOP - 28;
  FY = 0; FH = LINE;
  /* on a phone the circles use the whole width; on a wide screen they keep to a centered area as wide as it is tall, so they still meet */
  U = Math.min(W, FH);
  const inner = Math.min(FH, W * 0.75);
  LIM0 = (W - inner) / 2; LIM1 = (W + inner) / 2;
  /* the piece opens with the walls all the way in; every move the viewer makes gives the circles more room */
  if (!sized) { WL = LIM0; WR = LIM1; sized = true; }
  WL = Math.max(1, Math.min(WL, LIM0)); WR = Math.min(W - 1, Math.max(WR, LIM1));
  FX = WL; FW = WR - WL;
  DS = Math.min(W * 0.86, 420); DX0 = (W - DS) / 2;
}
function rowAt(e) {
  for (let i = 0; i < 4; i++) {
    if (Math.abs(e.clientY - rowY(i)) < ROW / 2 && e.clientX > DX0 - DS / 20 && e.clientX < DX0 + DS + DS / 20) return i;
  }
  return -1;
}
/* tapping a dot sets its row to that dot */
function wallAt(e) {
  if (e.clientY > LINE) return null;
  if (Math.abs(e.clientX - WL) < 16) return "L";
  if (Math.abs(e.clientX - WR) < 16) return "R";
  return null;
}
cv.addEventListener("pointerdown", function (e) {
  if (onFs(e)) return;
  held = wallAt(e);
  if (held) { cv.setPointerCapture(e.pointerId); return; }
  const i = rowAt(e);
  if (i >= 0) scales[i].z = Math.max(0, Math.min(10, Math.round((e.clientX - DX0) / DS * 10)));
});
/* the pointing hand over the dots */
cv.addEventListener("pointermove", function (e) {
  if (held === "L") { WL = Math.max(1, Math.min(e.clientX, LIM0)); FX = WL; FW = WR - WL; }
  if (held === "R") { WR = Math.min(W - 1, Math.max(e.clientX, LIM1)); FW = WR - WL; }
  cv.style.cursor = (held || wallAt(e)) ? "ew-resize" : (rowAt(e) >= 0 || onFs(e)) ? "pointer" : "default";
});
cv.addEventListener("click", function (e) { if (onFs(e)) toggleFs(); });
function release() { held = null; }
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  circles.forEach(function (c, k) {
    const r = radius(k) * U, rx = r / FW, ry = r / FH;
    c.a += (Math.random() - 0.5) * 0.02;
    c.x += Math.cos(c.a) * c.sp * speed(k) * dt * U / FW;
    c.y += Math.sin(c.a) * c.sp * speed(k) * dt * U / FH;
    if (c.x < rx) { c.x = rx; c.a = Math.PI - c.a; }
    if (c.x > 1 - rx) { c.x = 1 - rx; c.a = Math.PI - c.a; }
    if (c.y < ry) { c.y = ry; c.a = -c.a; }
    if (c.y > 1 - ry) { c.y = 1 - ry; c.a = -c.a; }
  });
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  /* one line across the whole screen, under the circles */
  g.lineWidth = 1.5; g.strokeStyle = "#333333";
  g.beginPath(); g.moveTo(0, LINE); g.lineTo(W, LINE); g.stroke();
  /* the walls rise from the line */
  g.beginPath(); g.moveTo(WL, 0); g.lineTo(WL, LINE); g.moveTo(WR, 0); g.lineTo(WR, LINE); g.stroke();
  const p = circles.map(function (c, k) { const q = new Path2D(); q.arc(FX + c.x * FW, FY + c.y * FH, radius(k) * U, 0, Math.PI * 2); return q; });
  g.save(); g.clip(p[0]); g.fillStyle = "#4d4d4d"; g.fill(p[1]); g.restore();
  g.strokeStyle = "#333333"; g.lineWidth = 1.5;
  p.forEach(function (q, k) {
    const out = new Path2D(); out.rect(0, 0, W, H); out.addPath(p[1 - k]);
    g.save(); g.clip(out, "evenodd"); g.stroke(q); g.restore();
  });
  /* the words are the same gray as the overlap, so they vanish where the circles meet */
  g.fillStyle = "#4d4d4d"; g.font = "14px Helvetica, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  circles.forEach(function (c) { g.fillText(c.word, FX + c.x * FW, FY + c.y * FH); });
  /* you between its two rows, me between its two, in the middle */
  g.font = "13px Helvetica, Arial, sans-serif"; g.textAlign = "center";
  ["you", "me"].forEach(function (w, k) {
    g.fillStyle = "#333333";
    g.fillText(w, DX0 + DS / 2, (rowY(k * 2) + rowY(k * 2 + 1)) / 2);
  });
  /* four rows of eleven dots in one muted 20% gray; the setting is a 40% gray; the middle is an open circle */
  scales.forEach(function (sc, i) {
    const dy = rowY(i), base = "#333333";
    for (let j = 0; j <= 10; j++) {
      const x = DX0 + DS * j / 10, on = j === sc.z;
      g.beginPath(); g.arc(x, dy, 5, 0, Math.PI * 2);
      if (j === 5) { g.strokeStyle = on ? "#666666" : base; g.lineWidth = on ? 2 : 1.2; g.stroke(); }
      else { g.fillStyle = on ? "#666666" : base; g.fill(); }
    }
  });
  if (FS) { g.beginPath(); g.arc(DX0 + DS / 2, fsY(), 6, 0, Math.PI * 2); g.fillStyle = (document.fullscreenElement || document.webkitFullscreenElement) ? "#666666" : "#333333"; g.fill(); }
  requestAnimationFrame(step);
}
size();
addEventListener("resize", size);
requestAnimationFrame(step);
}
</script>
</body>
</html>
