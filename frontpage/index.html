<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; background: #000; }
header { max-width: 1440px; margin: 0 auto; padding: 44px 24px 30px; box-sizing: border-box;
  font-family: Helvetica, Arial, sans-serif; color: #8c8c8c; font-size: 14px; line-height: 1.6; }
header a { color: #8c8c8c; text-decoration: none; border-bottom: 1px solid #444; }
header a:hover { color: #c8c8c8; }
img { display: block; width: 100%; max-width: 1440px; margin: 0 auto; }
</style>
</head>
<body>
<header>
<div id="name"></div>
<div><a id="link" target="_blank" rel="noopener"></a></div>
<div id="when"></div>
<div>Screen capture and redacted web project.</div>
</header>
<img alt="" src="front.jpg">
<script>
document.querySelector("img").src = "front.jpg?" + Date.now();
fetch("meta.json?" + Date.now()).then(function (r) { return r.json(); }).then(function (m) {
  document.getElementById("name").textContent = m.name;
  var a = document.getElementById("link");
  a.href = m.url; a.textContent = m.url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
  document.getElementById("when").textContent = m.date + (m.time ? ", " + m.time : "");
}).catch(function () {});
</script>
</body>
</html>
