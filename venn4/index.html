<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
#dial { position: absolute; display: flex; justify-content: space-between; align-items: center; }
#dial button { font: 20px/1 Helvetica, Arial, sans-serif; color: #e6e6e6; background: none; border: 0; min-width: 44px; min-height: 44px; padding: 0; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dial"><button id="minus" type="button" aria-label="less">&minus;</button><button id="plus" type="button" aria-label="more">+</button></div>
<script>
{
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, S, X0, Y0, dpr;
/* four scales, 0 to 10, 5 the middle: each person has a speed and a size */
const scales = [
  { name: "you speed", z: 5 }, { name: "you size", z: 5 },
  { name: "me speed", z: 5 }, { name: "me size", z: 5 }
];
let active = 0;
const ROW = 34;
function speed(k) { return Math.pow(1.45, scales[k * 2].z - 5); }
function radius(k) { return 0.0625 + scales[k * 2 + 1].z * 0.025; }
document.getElementById("minus").addEventListener("click", function () { scales[active].z = Math.max(0, scales[active].z - 1); });
document.getElementById("plus").addEventListener("click", function () { scales[active].z = Math.min(10, scales[active].z + 1); });
const circles = [0, 1].map(function (k) {
  return { x: 0.3 + Math.random() * 0.4, y: 0.3 + Math.random() * 0.4, a: Math.random() * Math.PI * 2, sp: 0.018 + Math.random() * 0.008, word: k ? "me" : "you" };
});
let TOP = 0;
function rowY(i) { return TOP + ROW / 2 + i * ROW + (i >= 2 ? 10 : 0); }
function size() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  S = Math.min(W * 0.72, (H - ROW * 4 - 150) * 0.95);
  X0 = (W - S) / 2; Y0 = Math.max(20, H * 0.04);
  /* the four rows and the controls, centered in the space between the square and the bottom of the screen */
  const block = ROW * 4 + 10 + 50;
  TOP = Y0 + S + Math.max(10, (H - Y0 - S - block) / 2);
  const d = document.getElementById("dial");
  d.style.left = (X0 - 14) + "px"; d.style.width = (S + 28) + "px"; d.style.top = (rowY(3) + ROW / 2 + 6) + "px";
}
/* tapping a row chooses it; tapping its middle dot returns it to 5 */
cv.addEventListener("pointerdown", function (e) {
  for (let i = 0; i < 4; i++) {
    if (Math.abs(e.clientY - rowY(i)) < ROW / 2 && e.clientX > X0 - 90 && e.clientX < X0 + S + 16) {
      active = i;
      if (Math.abs(e.clientX - (X0 + S / 2)) < S / 20) scales[i].z = 5;
    }
  }
});
let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  circles.forEach(function (c, k) {
    const R = radius(k);
    c.a += (Math.random() - 0.5) * 0.02;
    c.x += Math.cos(c.a) * c.sp * speed(k) * dt;
    c.y += Math.sin(c.a) * c.sp * speed(k) * dt;
    if (c.x < R) { c.x = R; c.a = Math.PI - c.a; }
    if (c.x > 1 - R) { c.x = 1 - R; c.a = Math.PI - c.a; }
    if (c.y < R) { c.y = R; c.a = -c.a; }
    if (c.y > 1 - R) { c.y = 1 - R; c.a = -c.a; }
  });
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.lineWidth = 1.5; g.strokeStyle = "#808080";
  g.strokeRect(X0, Y0, S, S);
  const p = circles.map(function (c, k) { const q = new Path2D(); q.arc(X0 + c.x * S, Y0 + c.y * S, radius(k) * S, 0, Math.PI * 2); return q; });
  g.save(); g.clip(p[0]); g.fillStyle = "#808080"; g.fill(p[1]); g.restore();
  g.strokeStyle = "#e6e6e6"; g.lineWidth = 1.5;
  p.forEach(function (q, k) {
    const out = new Path2D(); out.rect(0, 0, W, H); out.addPath(p[1 - k]);
    g.save(); g.clip(out, "evenodd"); g.stroke(q); g.restore();
  });
  g.fillStyle = "#e6e6e6"; g.font = "14px Helvetica, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  circles.forEach(function (c) { g.fillText(c.word, X0 + c.x * S, Y0 + c.y * S); });
  /* you beside its two rows, me beside its two */
  g.font = "13px Helvetica, Arial, sans-serif"; g.textAlign = "right";
  ["you", "me"].forEach(function (w, k) {
    g.fillStyle = (active >> 1) === k ? "#b3b3b3" : "#666666";
    g.fillText(w, X0 - 18, (rowY(k * 2) + rowY(k * 2 + 1)) / 2);
  });
  /* four rows of eleven dots in one dark gray; the tapped row brightens a little; the setting is the lightest dot; the middle is an open circle */
  scales.forEach(function (sc, i) {
    const dy = rowY(i), base = i === active ? "#666666" : "#4d4d4d";
    for (let j = 0; j <= 10; j++) {
      const x = X0 + S * j / 10, on = j === sc.z;
      g.beginPath(); g.arc(x, dy, 5, 0, Math.PI * 2);
      if (j === 5) { g.strokeStyle = on ? "#b3b3b3" : base; g.lineWidth = on ? 2 : 1.2; g.stroke(); }
      else { g.fillStyle = on ? "#b3b3b3" : base; g.fill(); }
    }
  });
  requestAnimationFrame(step);
}
size();
addEventListener("resize", size);
requestAnimationFrame(step);
}
</script>
</body>
</html>
