<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
#fog { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 55% 50% at 50% 50%, rgba(150,150,150,0.10), rgba(90,90,90,0.04) 55%, rgba(0,0,0,0) 80%); }
.w { position: absolute; left: 0; top: 0; font-family: Helvetica, Arial, sans-serif; font-weight: 400;
  white-space: pre; user-select: none; pointer-events: none; will-change: transform, filter;
  transform: translate3d(-9999px,-9999px,0); transform-origin: 50% 50%; }
.w.door { pointer-events: auto; cursor: pointer; }
body.idle, body.idle .w.door { cursor: none; }
</style>
</head>
<body>
<div id="fog"></div>
<script>
var WORDS = ["enter","blips","rise","fall","trickle","stay","change","begin","end","start","here","there","now","nowhere","everywhere","gone","dust","fragments","nothing","no","know","experiment","unfinished","exit"];
var BASE = 46;
var DEPTH = 2.2;
var canFull = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function r(a, b) { return a + Math.random() * (b - a); }
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
var bag = [];
function nextWord() {
  if (!bag.length) {
    bag = WORDS.slice();
    for (var i = bag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
  }
  return bag.pop();
}
var drops = [];
function spawn() {
  var word = nextWord();
  if ((word === "enter" || word === "exit") && !canFull) word = nextWord();
  var el = document.createElement("div");
  el.className = "w";
  el.textContent = word;
  el.style.fontSize = BASE + "px";
  document.body.appendChild(el);
  var z = Math.pow(Math.random(), 0.8);
  var d = {
    el: el, word: word, w: el.offsetWidth, h: el.offsetHeight,
    X: r(-0.55, 0.55), Y: 0, z: z,
    vy: r(0.035, 0.075), vz: r(-0.025, 0.025),
    sway: r(0.01, 0.035), phase: r(0, 6.28), freq: r(0.15, 0.4),
    rot0: r(-10, 10), ramp: r(4, 10), rfreq: r(0.08, 0.2), rot: 0, fy: 0, vfy: Math.random() < 0.25 ? r(-14, 14) : 0,
    lastBlur: -1
  };
  d.Y = -0.5 - 0.6 * (1 + z * DEPTH);
  if (word === "enter" || word === "exit") {
    el.addEventListener("click", function () {
      if (d.word === "enter" && !isFull()) {
        var de = document.documentElement, req = de.requestFullscreen || de.webkitRequestFullscreen;
        try { var p = req.call(de); if (p && p.catch) p.catch(function () {}); } catch (e) {}
      } else if (d.word === "exit" && isFull()) {
        var ex = document.exitFullscreen || document.webkitExitFullscreen;
        try { var q = ex.call(document); if (q && q.catch) q.catch(function () {}); } catch (e) {}
      }
    });
  }
  drops.push(d);
  setTimeout(spawn, r(900, 2000));
}
var last = performance.now(), T = 0;
function frame(now) {
  var dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  var W = innerWidth, H = innerHeight, cx = W / 2, cy = H / 2, U = Math.min(W, H);
  var full = isFull();
  for (var i = drops.length - 1; i >= 0; i--) {
    var d = drops[i];
    d.Y += d.vy * dt;
    d.z += d.vz * dt;
    if (d.z < 0) { d.z = 0; d.vz = Math.abs(d.vz); }
    if (d.z > 1) { d.z = 1; d.vz = -Math.abs(d.vz); }
    d.rot = d.rot0 + d.ramp * Math.sin(T * d.rfreq + d.phase);
    d.fy += d.vfy * dt;
    var s = 1 / (1 + d.z * DEPTH);
    var X = d.X + d.sway * Math.sin(T * d.freq + d.phase);
    var sx = cx + X * W * s, sy = cy + d.Y * U * s;
    if (sy - d.h * s > H + 20) { d.el.remove(); drops.splice(i, 1); continue; }
    var near = 1 - d.z;
    var b = Math.round(255 * (0.1 + 0.7 * Math.pow(near, 1.4)));
    d.el.style.color = "rgb(" + b + "," + b + "," + b + ")";
    var blur = Math.round(d.z * d.z * 30 / s) / 10;
    if (blur !== d.lastBlur) { d.el.style.filter = blur > 0 ? "blur(" + blur + "px)" : "none"; d.lastBlur = blur; }
    d.el.style.zIndex = String(1000 - Math.round(d.z * 1000));
    var door = (d.word === "enter" && !full) || (d.word === "exit" && full);
    d.el.className = door ? "w door" : "w";
    d.el.style.transform = "translate3d(" + (sx - d.w / 2) + "px," + (sy - d.h / 2) + "px,0) scale(" + s + ") rotate(" + d.rot + "deg) rotateY(" + d.fy + "deg)";
  }
  requestAnimationFrame(frame);
}
var idleT;
function wake() {
  document.body.classList.remove("idle"); clearTimeout(idleT);
  if (isFull()) idleT = setTimeout(function () { document.body.classList.add("idle"); }, 2000);
}
document.addEventListener("mousemove", wake);
document.addEventListener("fullscreenchange", wake);
document.addEventListener("webkitfullscreenchange", wake);
spawn();
requestAnimationFrame(frame);
</script>
</body>
</html>
