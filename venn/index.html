<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; }
#dial { position: absolute; display: flex; justify-content: space-between; align-items: center; }
#dial button { font: 20px/1 Helvetica, Arial, sans-serif; color: #e6e6e6; background: none; border: 0; min-width: 44px; min-height: 44px; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#dial button span { width: 12px; height: 12px; border: 1.5px solid #e6e6e6; border-radius: 50%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dial"><button id="minus" type="button" aria-label="slower">&minus;</button><button id="mid" type="button" aria-label="middle"><span></span></button><button id="plus" type="button" aria-label="faster">+</button></div>
<script>
{
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, S, X0, Y0, R, dpr;
/* two circles, three quarters the size of one quarter of the square, so they can meet and also miss each other; positions and velocities in square units (0..1) */
const circles = [0, 1].map(function () {
  const a = Math.random() * Math.PI * 2;
  return { x: 0.25 + Math.random() * 0.5, y: 0.25 + Math.random() * 0.5, a: a, sp: 0.018 + Math.random() * 0.008 };
});
/* the speed scale: 0 slowest to 10 fastest, 5 the middle, like a gray scale from black to white */
let zone = 5;
function factor() { return Math.pow(1.45, zone - 5); }
document.getElementById("minus").addEventListener("click", function () { zone = Math.max(0, zone - 1); });
document.getElementById("plus").addEventListener("click", function () { zone = Math.min(10, zone + 1); });
document.getElementById("mid").addEventListener("click", function () { zone = 5; });
function size() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  S = Math.min(W * 0.78, (H - 140) * 0.9);
  X0 = (W - S) / 2; Y0 = (H - S - 110) / 2;
  R = 0.1875;
  const d = document.getElementById("dial");
  d.style.left = (X0 - 14) + "px"; d.style.width = (S + 28) + "px"; d.style.top = (Y0 + S + 52) + "px";
}
let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  circles.forEach(function (c) {
    /* a very slow drift in heading, so the paths never settle into a pattern */
    c.a += (Math.random() - 0.5) * 0.02;
    c.x += Math.cos(c.a) * c.sp * factor() * dt;
    c.y += Math.sin(c.a) * c.sp * factor() * dt;
    /* touching the edge of the square, the circle turns back */
    if (c.x < R) { c.x = R; c.a = Math.PI - c.a; }
    if (c.x > 1 - R) { c.x = 1 - R; c.a = Math.PI - c.a; }
    if (c.y < R) { c.y = R; c.a = -c.a; }
    if (c.y > 1 - R) { c.y = 1 - R; c.a = -c.a; }
  });
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  /* the square at 50% brightness */
  g.lineWidth = 1.5; g.strokeStyle = "#808080";
  g.strokeRect(X0, Y0, S, S);
  /* where the two circles overlap, the shared space turns 50% gray */
  const p = circles.map(function (c) { const q = new Path2D(); q.arc(X0 + c.x * S, Y0 + c.y * S, R * S, 0, Math.PI * 2); return q; });
  g.save(); g.clip(p[0]); g.fillStyle = "#808080"; g.fill(p[1]); g.restore();
  /* the circles at 90% brightness, each outline drawn only outside the other circle, so the overlap stays solid gray */
  g.strokeStyle = "#e6e6e6";
  p.forEach(function (q, k) {
    const out = new Path2D(); out.rect(0, 0, W, H); out.addPath(p[1 - k]);
    g.save(); g.clip(out, "evenodd"); g.stroke(q); g.restore();
  });
  /* eleven dots under the square, 0 to 10; the selected one is filled */
  const dy = Y0 + S + 28;
  for (let i = 0; i <= 10; i++) {
    const dx = X0 + S * i / 10;
    g.beginPath(); g.arc(dx, dy, 4, 0, Math.PI * 2);
    if (i === zone) { g.fillStyle = "#e6e6e6"; g.fill(); } else { g.strokeStyle = "#808080"; g.lineWidth = 1.2; g.stroke(); }
  }
  requestAnimationFrame(step);
}
size();
addEventListener("resize", size);
requestAnimationFrame(step);
}
</script>
</body>
</html>
