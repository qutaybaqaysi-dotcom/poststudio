<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.dial { position: absolute; display: flex; justify-content: space-between; align-items: center; }
.dial button { font: 20px/1 Helvetica, Arial, sans-serif; color: #e6e6e6; background: none; border: 0; min-width: 44px; min-height: 40px; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.dial button span { width: 12px; height: 12px; border: 1.5px solid #e6e6e6; border-radius: 50%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
{
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, S, X0, Y0, dpr;
/* three scales, 0 to 10, 5 the middle: the speed of both circles, the size of you, the size of me */
const scales = [{ name: "speed", z: 5 }, { name: "you", z: 5 }, { name: "me", z: 5 }];
const ROW = 70;
scales.forEach(function (sc) {
  const d = document.createElement("div"); d.className = "dial";
  d.innerHTML = '<button type="button" aria-label="less">&minus;</button><button type="button" aria-label="middle"><span></span></button><button type="button" aria-label="more">+</button>';
  const b = d.querySelectorAll("button");
  b[0].addEventListener("click", function () { sc.z = Math.max(0, sc.z - 1); });
  b[1].addEventListener("click", function () { sc.z = 5; });
  b[2].addEventListener("click", function () { sc.z = Math.min(10, sc.z + 1); });
  document.body.appendChild(d); sc.el = d;
});
function speed() { return Math.pow(1.45, scales[0].z - 5); }
function radius(k) { return 0.0625 + scales[k + 1].z * 0.025; }   /* 5 gives the original size */
/* two circles, positions and velocities in square units (0..1) */
const circles = [0, 1].map(function (k) {
  return { x: 0.3 + Math.random() * 0.4, y: 0.3 + Math.random() * 0.4, a: Math.random() * Math.PI * 2, sp: 0.018 + Math.random() * 0.008, word: k ? "me" : "you" };
});
function size() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  S = Math.min(W * 0.78, (H - ROW * 3 - 40) * 0.92);
  X0 = (W - S) / 2; Y0 = Math.max(16, (H - S - ROW * 3 - 10) / 2);
  scales.forEach(function (sc, i) {
    sc.el.style.left = (X0 - 14) + "px"; sc.el.style.width = (S + 28) + "px";
    sc.el.style.top = (Y0 + S + 14 + i * ROW + 30) + "px";
  });
}
let last = performance.now();
function step(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  circles.forEach(function (c, k) {
    const R = radius(k);
    c.a += (Math.random() - 0.5) * 0.02;
    c.x += Math.cos(c.a) * c.sp * speed() * dt;
    c.y += Math.sin(c.a) * c.sp * speed() * dt;
    if (c.x < R) { c.x = R; c.a = Math.PI - c.a; }
    if (c.x > 1 - R) { c.x = 1 - R; c.a = Math.PI - c.a; }
    if (c.y < R) { c.y = R; c.a = -c.a; }
    if (c.y > 1 - R) { c.y = 1 - R; c.a = -c.a; }
  });
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.lineWidth = 1.5; g.strokeStyle = "#808080";
  g.strokeRect(X0, Y0, S, S);
  const p = circles.map(function (c, k) { const q = new Path2D(); q.arc(X0 + c.x * S, Y0 + c.y * S, radius(k) * S, 0, Math.PI * 2); return q; });
  g.save(); g.clip(p[0]); g.fillStyle = "#808080"; g.fill(p[1]); g.restore();
  g.strokeStyle = "#e6e6e6"; g.lineWidth = 1.5;
  p.forEach(function (q, k) {
    const out = new Path2D(); out.rect(0, 0, W, H); out.addPath(p[1 - k]);
    g.save(); g.clip(out, "evenodd"); g.stroke(q); g.restore();
  });
  /* the word at the center of each circle */
  g.fillStyle = "#e6e6e6"; g.font = "14px Helvetica, Arial, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  circles.forEach(function (c) { g.fillText(c.word, X0 + c.x * S, Y0 + c.y * S); });
  /* three rows of eleven dots, each with its name */
  scales.forEach(function (sc, i) {
    const dy = Y0 + S + 14 + i * ROW + 12;
    g.fillStyle = "#808080"; g.font = "11px Helvetica, Arial, sans-serif"; g.textAlign = "right";
    g.fillText(sc.name, X0 - 14, dy);
    for (let j = 0; j <= 10; j++) {
      g.beginPath(); g.arc(X0 + S * j / 10, dy, 4, 0, Math.PI * 2);
      if (j === sc.z) { g.fillStyle = "#e6e6e6"; g.fill(); } else { g.strokeStyle = "#808080"; g.lineWidth = 1.2; g.stroke(); }
    }
  });
  requestAnimationFrame(step);
}
size();
addEventListener("resize", size);
requestAnimationFrame(step);
}
</script>
</body>
</html>
