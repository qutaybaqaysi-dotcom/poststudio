<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
body { perspective: 800px; }
.h { position: absolute; left: 0; top: 0; font-family: Helvetica, Arial, sans-serif; font-weight: 700; color: #f2f2f2; line-height: 1.15; max-width: min(64vw, 760px); will-change: transform; user-select: none; }
.h .wd { display: inline-block; white-space: pre; }
.l { position: absolute; left: 0; top: 0; font-family: Helvetica, Arial, sans-serif; font-weight: 700; color: #f2f2f2; white-space: pre; will-change: transform; user-select: none; mix-blend-mode: screen; transform-origin: 50% 50%; }
</style>
</head>
<body>
<script>
var heads = [];
var next = 0;
var items = [];
var loose = [];
function r(a, b) { return a + Math.random() * (b - a); }
function speed(it) { return it.vy * (1 - 0.75 * it.gone / it.letters.length); }

function shuffle(list) {
for (var i = list.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var t = list[i]; list[i] = list[j]; list[j] = t;
}
return list;
}

function spawnHeadline() {
var prev = items[items.length - 1];
if (prev && prev.y < 22) { setTimeout(spawnHeadline, 400); return; }
if (heads.length) {
var rank = next % heads.length;
var text = heads[rank];
next++;
var el = document.createElement("div");
el.className = "h";
var size = rank < 3 ? r(26, 32) : rank < 10 ? r(19, 24) : r(15, 19);
var levels = [0.95, 0.5, 0.8, 0.38, 0.9, 0.62];
var op = levels[(next - 1) % levels.length];
el.style.fontSize = size + "px";
el.style.opacity = op;
var words = text.split(" ");
for (var w = 0; w < words.length; w++) {
var wd = document.createElement("span");
wd.className = "wd";
for (var c = 0; c < words[w].length; c++) {
var s = document.createElement("span");
s.className = "c";
s.textContent = words[w][c];
wd.appendChild(s);
}
el.appendChild(wd);
if (w < words.length - 1) el.appendChild(document.createTextNode(" "));
}
document.body.appendChild(el);
var maxX = Math.max(10, innerWidth - el.offsetWidth - 20);
var it = {
el: el, size: size, op: op,
x: r(Math.min(20, maxX), maxX),
y: -el.offsetHeight - 10,
h: el.offsetHeight,
vy: (innerHeight / 3) / r(7, 11),
letters: shuffle(Array.prototype.slice.call(el.querySelectorAll(".c"))),
gone: 0
};
items.push(it);
}
setTimeout(spawnHeadline, 300);
}

function detach(span, it) {
var b = span.getBoundingClientRect();
var el = document.createElement("div");
el.className = "l";
el.textContent = span.textContent;
el.style.fontSize = it.size + "px";
el.style.opacity = it.op;
document.body.appendChild(el);
span.style.visibility = "hidden";
loose.push({
el: el, op: it.op, fade: r(0.008, 0.03),
x: b.left, y: b.top,
vy: it.vy * r(0.15, 0.45), ay: r(0.5, 3), vx: r(-8, 8), ax: r(-3, 3),
rot: 0, vrot: r(-25, 25),
fy: 0, vfy: Math.random() < 0.5 ? r(-60, 60) : 0
});
}

var last = performance.now();
function frame(now) {
var dt = Math.min(0.05, (now - last) / 1000);
last = now;
var third = innerHeight / 3;
var order = items.slice().sort(function (a, b) { return b.y - a.y; });
for (var o = 1; o < order.length; o++) {
var ahead = order[o - 1], me = order[o];
me.y += speed(me) * dt;
if (ahead.gone < ahead.letters.length * 0.15) {
var limit = ahead.y - me.h - 18;
if (me.y > limit) me.y = limit;
}
me.moved = true;
}
if (order.length) { order[0].y += speed(order[0]) * dt; order[0].moved = true; }
for (var i = items.length - 1; i >= 0; i--) {
var it = items[i];
it.moved = false;
var progress = Math.min(1, Math.max(0, it.y / (innerHeight * 0.65)));
var target = Math.round(Math.pow(progress, 2.6) * it.letters.length);
while (it.gone < target) { detach(it.letters[it.gone], it); it.gone++; }
it.el.style.transform = "translate(" + it.x + "px," + it.y + "px)";
if (it.gone >= it.letters.length) {
it.el.remove();
items.splice(i, 1);
}
}
for (var k = loose.length - 1; k >= 0; k--) {
var p = loose[k];
p.vx += p.ax * dt;
p.vy += p.ay * dt;
p.x += p.vx * dt;
p.y += p.vy * dt;
p.rot += p.vrot * dt;
p.fy += p.vfy * dt;
p.op -= p.fade * dt;
p.el.style.opacity = Math.max(0, p.op);
p.el.style.transform = "translate3d(" + p.x + "px," + p.y + "px,0) rotate(" + p.rot + "deg) rotateY(" + p.fy + "deg)";
if (p.y > innerHeight + 60 || p.x < -80 || p.x > innerWidth + 80 || p.op <= 0) {
p.el.remove();
loose.splice(k, 1);
}
}
requestAnimationFrame(frame);
}

fetch("headlines.json?t=" + Date.now())
.then(function (res) { return res.json(); })
.then(function (data) {
heads = (data.headlines || []).filter(function (t) { return t && t.length > 0; });
spawnHeadline();
})
.catch(function () {});
requestAnimationFrame(frame);
</script>
</body>
</html>
