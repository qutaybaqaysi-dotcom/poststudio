<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
html, body { margin: 0; background: #fff; }
section { height: 100vh; height: 100svh; display: flex; flex-direction: column; box-sizing: border-box; }
header { flex: none; width: 100%; max-width: 1440px; margin: 0 auto; padding: 28px 24px 20px; box-sizing: border-box;
  font-family: Helvetica, Arial, sans-serif; color: #c4c4c4; font-size: 14px; line-height: 1.6; }
img { display: block; flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; object-position: center top; padding-bottom: 24px; box-sizing: border-box; }
</style>
</head>
<body>
<script>
function show(pages) {
  pages.forEach(function (pg) {
    var s = document.createElement("section");
    var h = document.createElement("header");
    h.textContent = (pg.iso || "") + (pg.time ? " - " + pg.time : "");
    var im = document.createElement("img");
    im.alt = "";
    im.src = pg.file + "?" + Date.now();
    s.appendChild(h); s.appendChild(im);
    document.body.appendChild(s);
  });
  document.title = pages.map(function (pg) { return pg.name; }).join(" / ");
}
fetch("meta.json?" + Date.now()).then(function (r) { return r.json(); }).then(function (m) {
  show(m.pages || [{ file: "front.jpg", name: m.name, iso: m.iso, time: m.time }]);
}).catch(function () { show([{ file: "front.jpg", name: "" }]); });
</script>
</body>
</html>
