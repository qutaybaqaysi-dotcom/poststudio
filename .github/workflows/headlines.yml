name: headlines

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch New York Times headlines
        run: |
          python3 - <<'PY'
          import json, html, urllib.request, xml.etree.ElementTree as ET
          url = "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=30).read()
          root = ET.fromstring(data)
          titles = []
          for item in root.iter("item"):
              t = html.unescape(item.findtext("title") or "").strip()
              if t and t not in titles:
                  titles.append(t)
          with open("headline/headlines.json", "w") as f:
              json.dump({"headlines": titles[:40]}, f, ensure_ascii=False, indent=1)
          print(len(titles), "headlines")
          PY
      - name: Render link preview image
        run: |
          pip install --quiet playwright pillow
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 -m http.server 8765 > /dev/null 2>&1 &
          sleep 2
          python3 - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          from PIL import Image
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(viewport={"width": 1200, "height": 630}, device_scale_factor=2)
                  await pg.goto("http://localhost:8765/headline/")
                  await pg.wait_for_timeout(26000)
                  await pg.screenshot(path="/tmp/shot.png")
                  await b.close()
          asyncio.run(main())
          im = Image.open("/tmp/shot.png").convert("L").resize((1200, 630), Image.LANCZOS)
          im.save("og.jpg", quality=72, optimize=True)
          PY
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update headlines
          file_pattern: headline/headlines.json og.jpg
