<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title></title>
<style>
html, body { margin: 0; height: 100%; background: #000; font-family: Helvetica, Arial, sans-serif; letter-spacing: 0.06em; }
#gate { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
#gate input { background: none; border: 0; border-bottom: 1px solid #4d4d4d; color: #b4b4b4; font: 16px Helvetica, Arial, sans-serif; letter-spacing: 0.2em; text-align: center; width: 160px; padding: 6px 0; outline: none; }
#gate input.no { border-bottom-color: #8c8c8c; }
#list { display: none; padding: 40px 32px; }
.row { font-size: 16px; color: #808080; line-height: 2.2; }
.row span { display: inline-block; min-width: 120px; }
.row a { color: #b4b4b4; text-decoration: none; margin-right: 18px; }
.row a:hover { color: #fff; }
</style>
</head>
<body>
<div id="gate"><input id="pw" type="password" autocomplete="off" aria-label="password"></div>
<div id="list">
<div class="row"><span>front page</span><a href="../frontpage/">v1</a><a href="../frontpage2/">v2</a><a href="../frontpage3/">v3</a><a href="../frontpage5/">v5 order test</a></div>
<div class="row"><span>venn</span><a href="../venn/">v1</a><a href="../venn2/">v2</a><a href="../venn3/">v3</a><a href="../venn4/">v4</a><a href="../venn5/">v5</a></div>
<div class="row"><span>headline</span><a href="../headline/">v1</a></div>
<div class="row"><span>shredder</span><a href="../shredder/">v1</a></div>
</div>
<script>
{
const KEY = "baf292b193a94f56cf9112a65ff9ec8df5cac779ee5e9463059675a3dfd4899d";
const gate = document.getElementById("gate"), list = document.getElementById("list"), pw = document.getElementById("pw");
const show = function () { gate.style.display = "none"; list.style.display = "block"; }
try { if (sessionStorage.getItem("test") === "1") show(); } catch (e) {}
pw.focus();
pw.addEventListener("keydown", async function (e) {
  if (e.key !== "Enter") return;
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw.value));
  const h = Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
  if (h === KEY) { try { sessionStorage.setItem("test", "1"); } catch (e) {} show(); }
  else { pw.value = ""; pw.classList.add("no"); setTimeout(function () { pw.classList.remove("no"); }, 600); }
});
}
</script>
</body>
</html>
